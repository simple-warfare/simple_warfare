text: > 急冻炮击 <
description: 执行寒冷炮击, 对大范围地方单位造成大量低温效果\n180s冷却
fireTurretXAtGround:瞄准
fireTurretXAtGround_showGuideDecals: 准星
setUnitMemory:targetX=thisActionTarget.x,targetY=thisActionTarget.y
alsoQueueAction:转向
displayType:action
iconImage:SHARED:icon_attack_point.png
isActive:if self.queueSize==0
addActionCooldownTime: 150s
[hiddenAction_转向]
buildSpeed:3s
whenBuilding_rotateTo_aimAtActionTarget:true
whenBuilding_rotateTo_rotateTurretX:1
whenBuilding_rotateTo_waitTillRotated:true
spawnEffectsOnQueue: CUSTOM:左光, CUSTOM:右光, CUSTOM: 蓄力
alsoQueueAction:发射
[hiddenAction_发射]
buildSpeed:0s
fireTurretXAtGround:1
fireTurretXAtGround_withProjectile: 急冻炮击
