[core]
copyFrom:炮塔模板.template
name: [T3]亚零度火炮
displayDescription: [建筑] [攻击: 陆, 空] [ALB]\n能够进行四连射的炮塔, 装填速度慢\n发射极寒弩箭, 能够造成低温降低敌方移动速度\n可以手动设置是否对空,对空军伤害减半\n[急冻弩箭]\n伤害100*4,攻击范围350,冷却6.6s,对陆对空[AL1● AL2● AL3▼ ALB○] [低温150]
maxHp: 2600
buildSpeed: 96s
selfBuildRate: 96s
@memory targetX:float
@memory targetY:float

[template_core]
NanoP: 13000
tags: 对陆
[attack]
turretSize: 16
turretTurnSpeed: 1
maxAttackRange: 460
shootDelay: 0.1s
aimOffsetSpread: 0.02

[action_急冻炮击]
