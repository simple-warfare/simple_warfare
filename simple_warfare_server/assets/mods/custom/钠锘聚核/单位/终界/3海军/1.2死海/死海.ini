turretSize:36
turretTurnSpeed:1.8
maxAttackRange:290
shootDelay:0.2s
turretMultiTargeting:true
[turret_1]
x:0
y:10
barrelX: -3
barrelOffsetX_onOddShots: 6
image_drawOffsetY:-5
shoot_sound:plasma_fire
shoot_sound_vol:0.05
shoot_flame:small
shoot_light:#FFccCCEE
warmup:0.1s
chargeEffectImage: SHARED:lighting_charge.png
projectile:1
recoilOffset:-1
idleDir:0

[projectile_1]
@copyFromSection:template_抛射体2
mutatorAL1_areaDamageMultiplier:1
mutatorAL2_areaDamageMultiplier:0.7
mutatorAL3_areaDamageMultiplier:0.4
mutator建筑_areaDamageMultiplier:0.75
