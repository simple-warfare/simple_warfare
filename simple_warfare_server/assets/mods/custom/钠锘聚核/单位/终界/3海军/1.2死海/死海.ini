[core]
copyFrom:ROOT:模板/核心.template,ROOT:模板/终界.template
name:死海
maxHp:1000
buildSpeed:30s
radius:20
displayDescription: [水] [攻击: 陆] [AL2]\n海军的主战力,射程远,火力强悍,但是自身移动缓慢\n攻击附带低温效果\n[低温光束炮]伤害60,攻击范围290,冷却0.2s,预热0.1s,对陆[AL1● AL2▼ AL3▽ ALB●] [低温10]\n[中型单位]占用3格运输栏
transportSlotsNeeded: 3

[template_core]
NanoP: 2500
tags: AL2,对陆
techLevel: 1

[graphics]
image:死海.png
image_wreak:死海死亡.png
