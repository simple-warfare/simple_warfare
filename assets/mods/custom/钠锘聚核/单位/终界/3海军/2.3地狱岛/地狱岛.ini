life:200
color:#1E1E96
drawType: 2
frame: 0
drawSize: 0.5
trailEffect:true
trailEffectRate:0.4
explodeEffect:smallExplosion,CUSTOM:sparks*6,CUSTOM:hitLightFlash

[turret_导弹主]
x: 0
y: -25
turnSpeedAcceleration: 0.4
canShoot:false
canAttackLandUnits:false
canAttackUnderwaterUnits:false
[turret_导弹1]
x:-10
y: 2
shoot_sound:large_gun_fire2
shoot_sound_vol:1
attachedTo: 导弹主
slave: true
projectile:导弹
size:0
invisible:true
canAttackLandUnits:false
canAttackUnderwaterUnits:false
[turret_导弹2]
x:10
y:2
copyFrom:导弹1
linkDelayWithTurret:导弹1
warmup:0.4s


[effect_hitLightFlash]
