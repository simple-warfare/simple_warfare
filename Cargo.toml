[workspace.package]
authors = ["shishanyue"]
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = [
    "crates/simple_warfare_macros",
    "simple_warfare_server",
]

default-members = [
    "crates/simple_warfare_macros",
    "simple_warfare_server",
]
exclude = []

# Here is a configuration for the most aggressive optimizations possible
# Read this when trying to optimise WASM build: https://bevy-cheatbook.github.io/platforms/wasm/size-opt.html
[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

# If your own code does CPU-intensive work, you might want to also enable some optimization for it.
# Enable only a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3


[workspace.dependencies]
simple_warfare_server = { path = "./simple_warfare_server", version = "*" }

#utils
rand = { version = "0.9.2" }
thiserror = { version = "2.0.14" }
simple_warfare_macros = { path = "./crates/simple_warfare_macros" }


# serialization
serde = "1.0.219"
toml = "0.9.5"
bincode = { version = "2.0.1", features = ["serde"] }
serde_json = "1.0.140"


[workspace.lints.rust]
dead_code = "allow"
unused_variables = "allow"
# mismatched_lifetime_syntaxes = "allow"

[workspace.lints.clippy]
type_complexity = "allow"
missing_transmute_annotations = "allow"
len_without_is_empty = "allow"
too_many_arguments = "allow"
module_inception = "allow"
alloc_instead_of_core = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
