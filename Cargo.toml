[workspace]
resolver = "3"
members = [
    "crates/*",
    "simple_warfare_client",
    "simple_warfare_server",
    "simple_warfare_shared",
]

default-members = ["crates/*", "simple_warfare_server"]
exclude = []

[workspace.package]
authors = ["shishanyue"]
version = "0.1.0"
edition = "2024"

# Here is a configuration for the most aggressive optimizations possible
# Read this when trying to optimise WASM build: https://bevy-cheatbook.github.io/platforms/wasm/size-opt.html
[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

# If your own code does CPU-intensive work, you might want to also enable some optimization for it.
# Enable only a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3


[workspace.dependencies]
simple_warfare_server = { path = "./simple_warfare_server", version = "0.1.0" }
simple_warfare_shared = { path = "./simple_warfare_shared", version = "0.1.0" }

#utils
rand = { version = "0.9.2" }
thiserror = { version = "2.0.16" }
simple_warfare_server_macros = { path = "./crates/simple_warfare_server_macros" }
simple_warfare_shared_macros = { path = "./crates/simple_warfare_shared_macros" }
uuid-simd = "0.8.0"
crc32fast = "1.5.0"
clap = { version = "4.5.45", features = ["derive"] }

# serialization
serde = "1.0.219"
toml = "0.9.5"
bincode = { version = "2.0.1", features = ["serde"] }
serde_json = "1.0.143"


[workspace.dependencies.lightyear]
version = "0.23.0"
default-features = false
features = [
    "netcode",
    "steam",
    "udp",
    "webtransport",
    "deterministic",
    "interpolation",
    "replication",
]

[workspace.dependencies.bevy]
version = "0.16.1"
default-features = false
features = [
    "std",
    "bevy_log",
    "async_executor",
    "bevy_asset",
    "bevy_state",
    "multi_threaded",
    "sysinfo_plugin",
    "serialize",
    "bevy_color",
]
