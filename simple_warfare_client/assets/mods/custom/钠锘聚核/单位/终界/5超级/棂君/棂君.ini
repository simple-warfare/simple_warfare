slave: true
image:棂君炮管左.png
idleDir:0
shoot_sound:ROOT:数据/音效/发射.ogg
shoot_sound_vol:0.3
shoot_flame:CUSTOM: 雾气左*24
shoot_light:#EEEECCCC
turnSpeedAcceleration: 0.1
turnSpeed: 0
recoilOffset: -24
recoilOutTime: 3
recoilReturnTime: 240
chargeEffectImage:ROOT:数据/贴图/特效/高光紫.png
