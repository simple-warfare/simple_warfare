[core]
copyFrom: ROOT:模板/核心.template,ROOT:模板/终界.template,特效.template
name:棂君
displayDescription: [陆] [攻击: 陆] [AL3]\n终界科技的成果之一,利用聚能离子炮贯穿攻击敌方并引发巨大爆炸\n战场上宛如棺杦,葬送敌军的灵魂\n聚能时间长,伤害大\n[棂君粒子炮]伤害800*2,溅射范围80,攻击范围275,冷却6s,预热3s,对陆AL1▽ AL2▼ AL3● ALB▼]\n[超级单位]占用10格运输栏
mass: 20000
maxHp: 8000
buildSpeed: 80s
radius:38
transportSlotsNeeded:8
@memory 红温右: float
@memory 红温左: float
autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.1s
[template_core]
NanoP: 24000
tags: AL3,对陆
techLevel: 3
[graphics]
total_frames:3
animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 3.5
image:棂君.png
